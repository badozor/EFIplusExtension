name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          # last R version before native UTF-8 on Windows (latin-1 locale)
          - os: windows-latest
            r: "4.1.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: R version
        run: Rscript --version
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Tests (checks, R engine, Excel round trip)
        run: python -m pytest -v tests
      - name: efitools-1.3 alone with Rscript
        shell: bash
        run: |
          cd engine
          EFI_DIR="$PWD" Rscript --vanilla maindiad.R "$PWD/../tests/data/input.txt" "$RUNNER_TEMP/out.txt" "$PWD/../tests/data/diadromous.txt"
          python -c "import pandas as pd, sys; a=pd.read_csv(sys.argv[1],sep=';'); b=pd.read_csv('../tests/data/out_diad.txt',sep=';'); pd.testing.assert_frame_equal(a,b); print('same output as reference')" "$RUNNER_TEMP/out.txt"
